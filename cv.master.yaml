verification:
  reviewBeforePublishing:
    - id: vk-role-details
      item: VK responsibilities and achievements
      detail: 'User confirmed employment at VK started in 2025-04 as a Team Lead on two assignments: the platform team in the SocCom business unit from 2025-04 through 2025-12, and the Donations product team from 2026-01 to present. The shared stack is PHP, Go, React, in-house storage systems, Postgres, monolith, and microservices. Donations details are confirmed: 8 direct reports (3 backend, 2 frontend, 1 iOS, 1 Android, 1 QA), a one-quarter rebrand, launch into VK profiles beyond Communities, backend delivery connected to a dedicated migration team for moving the service from monolith to microservices, and product reach growth that supported DAU/MAU. Donations rebrand metrics are confirmed for the first three weeks after release: +3,276 creators with Donations enabled (+3.96% over the active-creator base), +469 monetizing creators (+1.4%), +880,743 RUB in donations turnover (+0.37%), and +3,578 donations (+0.55%); these came from product manager and analyst summary and are an early partial read of the larger Donations-in-profile rollout. SocCom details are confirmed: a direct platform team of 8, cross-team synchronization across 3 teams during the goods-scaling initiative, delivery leadership for 3 additional backend engineers from another team, scaling community goods from 20K to millions, 40 Ozon seller integrations with about 3M imported products and about 1M AdBlogger offers, recommendation-system migration under the Hadoop shutdown deadline, creation of the K2 Goods component for feed migration, platform process rollout, and VKUI / SPA frontend unification. Donations in VK profiles is now released, with confirmed April-May 2026 product growth metrics: profiles with Donations connected 789 to 999 (+27%), monetizing profiles 240 to 521 (+117%), donations turnover about 235K to about 478K RUB (+103%), donation count 430 to 1,200 (+179%), connection-to-monetization about 30% to about 52%, and about 80% of turnover from one-time donations. Optional follow-up precision before final publication: full Donations-in-profile DAU/MAU impact and the exact traffic-loss metric avoided during migration incident response.'
    - id: legacy-contact-handles
      item: Mapping of legacy handles to actual public profiles
      detail: The icon row in the legacy resume includes "@xawkay" and "xawkay", but the services are not fully recoverable from PDF extraction.
    - id: street-address
      item: Street-level address from the legacy resume
      detail: Confirm whether any future CV should include the exact address or only city and country.
    - id: certification-title
      item: Exact General Electric certification title
      detail: Legacy resume and public LinkedIn profile both use "General Electric Smallworld GIS Certified Developer", but the exact official certificate wording should still be checked if the certification stays in a final public version.
    - id: legacy-headline
      item: Legacy headline wording
      detail: '"Team Leader & Proud Geek" is preserved as historical input but not treated as the default canonical headline.'
