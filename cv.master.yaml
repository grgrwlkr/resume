        team:
          directReports: 8
          composition:
            backendDevelopers: 3
            frontendDevelopers: 2
            iosDevelopers: 1
            androidDevelopers: 1
            qaEngineers: 1
        responsibilities:
          - Led the Donations team with eight direct reports across backend, frontend, iOS, Android, and QA.
          - Connected backend delivery with a dedicated migration team to accelerate the Donations service move from monolith to microservices.
        achievements:
          - Delivered the Donations rebrand and launched Donations in VK profiles within one quarter, where donations had previously been available only in Communities.
          - Launched Donations in VK profiles and drove strong month-over-month growth in the first two months (April-May 2026) - donations turnover roughly doubled from about 235K to about 478K RUB (+103%), the number of donations nearly tripled from 430 to 1,200 (+179%), profiles with Donations connected grew from 789 to 999 (+27%), and monetizing profiles grew from 240 to 521 (+117%), lifting connection-to-monetization from about 30% to about 52%.
          - Drove measurable lift from the Donations rebrand within the first three weeks after release, partly preceding the full Donations-in-profile rollout to which the rebrand belongs - +3,276 creators with Donations enabled (+3.96% over the active-creator base), +469 monetizing creators (+1.4%), +880,743 RUB in donations turnover (+0.37%), and +3,578 donations (+0.55%).
        metrics:
          donationsRebrandFirstThreeWeeks:
            window: first 3 weeks after release
            scope: Donations rebrand (sub-feature of the Donations-in-profile initiative)
            results:
              - metric: creators with Donations enabled
                deltaAbsolute: 3276
                deltaPercentVsBase: 3.96
                baseDescription: total active-creator base
              - metric: monetizing creators
                deltaAbsolute: 469
                deltaPercentVsBase: 1.4
                baseDescription: total monetizing-creator base
              - metric: donations turnover
                deltaAbsoluteRub: 880743
                deltaPercentVsBase: 0.37
                baseDescription: total donations turnover
              - metric: number of donations
                deltaAbsolute: 3578
                deltaPercentVsBase: 0.55
                baseDescription: total donation count
            source: product manager and project analyst summary, internal Slack
            longerTermExpectation: longer-running effect expected to exceed the 3-week numbers
        notes:
          - Donations rebrand metrics are confirmed; full Donations-in-profile rollout metrics (DAU/MAU) still pending and can replace placeholders later.
      - id: vk-soccom-platform
        teamName: Platform team
        businessUnit: SocCom
        role: Team Lead
        start: 2025-04
        end: 2025-12
        focus: Strategic platform initiatives across the SocCom direction, including seller integrations, product scaling, critical migration, and frontend unification.
        team:
          directReports: 8
          composition:
            backendDevelopers: 3
            frontendDevelopers: 1
            iosDevelopers: 2
            androidDevelopers: 1
            qaEngineers: 1
          initiativeScope:
            coordinatedTeams: 3
            additionalBackendDevelopersFromAnotherTeam: 3
        responsibilities:
          - Led a platform team of eight direct reports across backend, frontend, iOS, Android, and QA, and during the goods-scaling initiative also coordinated delivery from three backend engineers in another team.
          - Led strategic technical initiatives across the SocCom direction, coordinating multiple teams, planning risk mitigation, and driving release readiness for business-critical changes.
          - Coordinated urgent migration work between the SocCom and EKP teams under the Hadoop shutdown deadline, including delivery of the K2 Goods component needed for feed migration to microservices.
          - Built cross-functional operating processes for the platform team, including the team working model and engineering duty rotation.
          - Led frontend unification across iOS, Android, and web, prioritizing work and coordinating delivery around VKUI adoption and SPA modernization.
        achievements:
          - Removed a key business constraint by scaling community goods from 20K to millions through a stable release backed by load testing, synchronization across three teams, and delivery leadership for three additional backend engineers from another team.
          - Enabled integration for 40 Ozon sellers with catalogs of 20K+ products; imported about 3M products and created about 1M AdBlogger offers for 1P and 3P goods, while opening a seller flow that no longer required creating a community before uploading goods.
          - Hit the recommendation-system migration deadline and helped prevent a significant traffic loss during incident response.
          - Increased VKUI coverage from 35% to 64% on iOS and reached 84% on Android.
        notes:
          - Add an exact traffic-loss metric only if it is needed before publishing an external resume version.
