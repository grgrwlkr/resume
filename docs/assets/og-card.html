<!doctype html>
<!-- Source for the 1200x630 social-share image. Render with:
     CHROME=".../Google Chrome" "$CHROME" --headless=new --disable-gpu \
       --hide-scrollbars --force-device-scale-factor=1 --window-size=1200,630 \
       --virtual-time-budget=4000 --screenshot=og.jpg "file://$PWD/og-card.html"
     Output replaces assets/og.jpg (referenced by the OG/Twitter meta tags). -->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Hanken+Grotesk:wght@400;500;600&display=swap"
    />
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1200px; height: 630px; }
      body {
        font-family: 'Hanken Grotesk', system-ui, sans-serif;
        background: #0a0a0b;
        color: #e6e6e8;
        position: relative;
        overflow: hidden;
      }
      .glow {
        position: absolute;
        inset: 0;
        background: radial-gradient(60% 80% at 78% 40%, rgba(99, 102, 241, 0.32), transparent 60%);
      }
      .grid {
        position: absolute;
        inset: 0;
        background-image: radial-gradient(rgba(255, 255, 255, 0.05) 1px, transparent 1px);
        background-size: 26px 26px;
        mask-image: radial-gradient(ellipse at 30% 40%, #000 35%, transparent 80%);
      }
      .wrap {
        position: relative;
        height: 100%;
        display: grid;
        grid-template-columns: 1fr 360px;
        align-items: center;
        gap: 56px;
        padding: 72px 80px;
      }
      .kicker {
        display: inline-block;
        font-size: 22px;
        font-weight: 500;
        color: #9a9aa3;
        letter-spacing: 0.02em;
        margin-bottom: 22px;
      }
      h1 {
        font-family: 'Fraunces', Georgia, serif;
        font-optical-sizing: auto;
        font-weight: 600;
        font-size: 92px;
        line-height: 1.0;
        letter-spacing: -0.02em;
        margin-bottom: 18px;
      }
      .role {
        font-size: 34px;
        font-weight: 600;
        color: #818cf8;
        margin-bottom: 30px;
      }
      .meta {
        font-size: 24px;
        color: #c4c4cc;
        line-height: 1.5;
        max-width: 620px;
      }
      .chips { margin-top: 30px; display: flex; gap: 12px; }
      .chip {
        font-size: 20px;
        padding: 8px 18px;
        border-radius: 999px;
        border: 1px solid #26262c;
        background: rgba(255, 255, 255, 0.03);
        color: #d8d8df;
      }
      .photo {
        height: 486px;
        border-radius: 28px;
        overflow: hidden;
        border: 1px solid #26262c;
        background: #111114;
        box-shadow: 0 30px 80px rgba(0, 0, 0, 0.5);
      }
      .photo img { width: 100%; height: 100%; object-fit: cover; object-position: 50% 22%; }
    </style>
  </head>
  <body>
    <div class="glow"></div>
    <div class="grid"></div>
    <div class="wrap">
      <div>
        <span class="kicker">Moscow, Russia</span>
        <h1>Gregory<br />Agapov</h1>
        <div class="role">Engineering Team Lead</div>
        <p class="meta">15+ years in software engineering · 5+ years leading teams.<br />Currently leading VK&rsquo;s Donations product team.</p>
        <div class="chips">
          <span class="chip">VK</span>
          <span class="chip">.NET · Go · React</span>
          <span class="chip">Team Lead</span>
        </div>
      </div>
      <div class="photo"><img src="portrait.jpg" alt="" /></div>
    </div>
  </body>
</html>
