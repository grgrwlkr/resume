      - Holds high standards and is comfortable taking charge.
      - Adapts plans to changing demands.
      - Combines imagination, logic, and rigor in problem solving.
      - Stays calm and confident under pressure.
      - Takes feedback well and keeps learning.
    watchouts:
      - Direct communication can read as harsh.
      - Can miss emotional cues if not deliberate.
      - Should actively show appreciation and make space for others.

