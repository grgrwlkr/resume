targetProfiles:
  teamLead:
    targetTitle: Team Lead
    goal: Maximize evidence of leadership, mentoring, turnaround ownership, and hands-on technical credibility.
    summaryStrategy:
      openingNarrative: Hands-on engineering leader with a strong software background who builds teams, mentors engineers, rescues struggling initiatives, and ships internal platforms with clear business value.
      proofPoints:
        - Built an MVP on schedule and got strong business and user feedback.
        - Turned around a struggling project with a business-aligned one-year plan.
        - Built and mentored teams, including mentees who later moved into full-time roles.
        - Keeps technical credibility by directly shipping backend and frontend systems.
      tone:
        - direct
        - outcome_oriented
        - leadership_first
        - technically_grounded
    emphasisTags:
      - team_lead
      - mentoring
      - turnaround
      - delivery
      - cross_functional
      - stakeholder_alignment
      - hands_on
    preferredExperienceIds:
      - vk-team-lead
      - tinkoff-mentoring-team-lead
      - tinkoff-performance-review-team-lead
      - tinkoff-organization-structure-senior
    supportingExperienceIds:
      - tinkoff-performance-review-middle
      - neotech-gis-senior
      - aisa-railway-middle
    optionalCompressedExperienceIds:
      - cinimex-middle
    bulletSelectionHints:
      mustIncludeThemes:
        - mentoring_and_people_growth
        - turnaround_or_stabilization
        - business_and_analytics_alignment
        - production_delivery
        - hands_on_technical_depth
      avoidOverweighting:
        - personality_assessment_jargon
        - raw_psychometric_percentages
        - exact_street_address
        - short_low_signal_roles
      compressionRules:
        - Keep both Tinkoff Team Lead roles detailed.
        - Keep at least one hands-on senior role detailed to preserve implementation credibility.
        - Compress early legacy enterprise work unless the target role explicitly values those stacks.

verification:
  reviewBeforePublishing:
    - id: vk-role-details
      item: VK responsibilities and achievements
      detail: 'User confirmed employment at VK started in 2025-04 as a Team Lead on two assignments: the platform team in the SocCom business unit from 2025-04 through 2025-12, and the Donations product team from 2026-01 to present. The shared stack is PHP, Go, React, in-house storage systems, Postgres, monolith, and microservices. Donations details are now confirmed: 8 direct reports (3 backend, 2 frontend, 1 iOS, 1 Android, 1 QA), a one-quarter rebrand, launch into VK profiles beyond Communities, backend delivery connected to a dedicated migration team for moving the service from monolith to microservices, and product reach growth that supported DAU/MAU. SocCom responsibilities and quantified product metrics still need to be added before generating final public CVs.'
    - id: legacy-contact-handles
      item: Mapping of legacy handles to actual public profiles
      detail: The icon row in the legacy resume includes "@xawkay" and "xawkay", but the services are not fully recoverable from PDF extraction.
    - id: street-address
      item: Street-level address from the legacy resume
      detail: Confirm whether any future CV should include the exact address or only city and country.
    - id: certification-title
      item: Exact General Electric certification title
      detail: The certification text is split in the PDF and should be checked against the official wording.
    - id: legacy-headline
      item: Legacy headline wording
      detail: '"Team Leader & Proud Geek" is preserved as historical input but not treated as the default canonical headline.'
