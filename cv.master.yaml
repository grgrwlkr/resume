targetProfiles:
  teamLead:
    targetTitle: Team Lead
    goal: Maximize evidence of leadership, mentoring, turnaround ownership, and hands-on technical credibility.
    summaryStrategy:
      openingNarrative: Hands-on Team Lead with 15+ years in software engineering and 5+ years of direct people management across teams of 6-8. Builds products from MVP to scale without losing technical depth. Currently leading VK's Donations product team (8 direct reports across backend, frontend, mobile, and QA).
      proofPoints:
        - Leads an 8-person Donations team across backend, frontend, iOS, Android, and QA.
        - Delivered a one-quarter rebrand and expanded Donations from Communities into VK profiles, with the rebrand alone adding +3.96% creators with Donations enabled and +1.4% monetizing creators in the first three weeks.
        - After launching Donations in VK profiles, drove month-over-month growth in the first two months - donations turnover roughly doubled (+103%) and donation count nearly tripled (+179%), with connection-to-monetization improving from about 30% to about 52%.
        - Helped accelerate the Donations service move from monolith to microservices.
        - Led SocCom platform work across three teams, including delivery leadership for three additional backend engineers, lifting community goods limits from 20K to millions and enabling 40 Ozon seller integrations with about 3M imported products.
        - Coordinated a critical recommendation-system migration under the Hadoop shutdown deadline and helped avoid major traffic loss.
        - Built platform operating processes and led frontend unification, growing VKUI coverage from 35% to 64% on iOS and to 84% on Android.
        - Built an MVP on schedule and got strong business and user feedback.
        - Turned around a struggling project with a business-aligned one-year plan.
        - Built and mentored teams, including mentees who later moved into full-time roles.
        - Keeps technical credibility by directly shipping backend and frontend systems.
      tone:
        - direct
        - outcome_oriented
        - leadership_first
        - technically_grounded
    emphasisTags:
