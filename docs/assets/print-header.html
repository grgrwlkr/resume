<!doctype html>
<!-- Source for the opaque PDF header artwork. docs/build-pdf.sh renders this
     at 3x resolution before exporting either language. Keep text in index.html
     so it stays searchable and selectable in the PDF. -->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 794px; height: 330px; overflow: hidden; }
      body {
        position: relative;
        background: linear-gradient(180deg, #969696 0%, #a8a8a8 30%, #b3b3b3 55%, #bcbcbc 80%, #cdcdcd 100%);
      }
      img {
        position: absolute;
        left: 323px;
        top: -262px;
        width: 460px;
        height: 690px;
        object-fit: cover;
        -webkit-mask-image: linear-gradient(90deg, transparent 0%, #000 28%, #000 88%, transparent 100%);
        mask-image: linear-gradient(90deg, transparent 0%, #000 28%, #000 88%, transparent 100%);
      }
    </style>
  </head>
  <body><img src="portrait.jpg" alt="" /></body>
</html>
