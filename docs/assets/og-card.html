<!doctype html>
<!-- Source for the 1200x630 social-share image. Render with:
     CHROME=".../Google Chrome" "$CHROME" --headless=new --disable-gpu \
       --hide-scrollbars --force-device-scale-factor=1 --window-size=1200,630 \
       --virtual-time-budget=4000 --screenshot=og.png "file://$PWD/og-card.html"
     then convert og.png to JPEG as assets/og.jpg (referenced by the OG/Twitter meta tags). -->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Manrope:wght@200;300;400;500;600&display=swap"
    />
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }
      html, body { width: 1200px; height: 630px; }
      body {
        position: relative;
        overflow: hidden;
        font-family: 'Manrope', system-ui, sans-serif;
        color: #161616;
        /* Continues the portrait's studio backdrop at this crop. */
        background: linear-gradient(180deg, #8c8c8c 0%, #a3a3a3 30%, #b2b2b2 55%, #b9b9b9 78%, #cdcdcd 100%);
      }
      .photo {
        position: absolute;
        left: 540px;
        top: -380px;
        height: 1040px;
        width: auto;
        -webkit-mask-image: linear-gradient(90deg, transparent 0%, #000 24%, #000 80%, transparent 100%);
        mask-image: linear-gradient(90deg, transparent 0%, #000 24%, #000 80%, transparent 100%);
      }
      .text {
        position: absolute;
        left: 72px;
        top: 72px;
        width: 560px;
        display: flex;
        flex-direction: column;
        gap: 18px;
      }
      .eyebrow {
        font-size: 18px;
        font-weight: 600;
        letter-spacing: 0.3em;
        text-transform: uppercase;
      }
      h1 {
        font-size: 92px;
        line-height: 0.98;
        font-weight: 200;
        letter-spacing: -0.02em;
      }
      .tag {
        font-size: 26px;
        font-weight: 400;
        line-height: 1.35;
      }
      .specs {
        position: absolute;
        left: 72px;
        bottom: 64px;
        display: flex;
        gap: 36px;
      }
      .spec {
        border-top: 1px solid rgba(22, 22, 22, 0.45);
        padding-top: 10px;
        min-width: 130px;
      }
      .big {
        font-size: 44px;
        font-weight: 300;
        line-height: 1.05;
      }
      .label {
        font-size: 16px;
        font-weight: 500;
      }
    </style>
  </head>
  <body>
    <img class="photo" src="portrait.jpg" alt="" />
    <div class="text">
      <div class="eyebrow">Team Lead · VK</div>
      <h1>Gregory<br />Agapov</h1>
      <p class="tag">Calm under pressure.<br />Uncompromising on results.</p>
    </div>
    <div class="specs">
      <div class="spec"><div class="big">15+</div><div class="label">years engineering</div></div>
      <div class="spec"><div class="big">5+</div><div class="label">years leading teams</div></div>
      <div class="spec"><div class="big">8</div><div class="label">direct reports</div></div>
    </div>
  </body>
</html>
